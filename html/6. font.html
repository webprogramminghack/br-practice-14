<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Styling In CSS</title>
    <link rel="stylesheet" href="../css/6. font.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barriecito&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <p class="font-weight">Test style font using font weight</p>
    <p class="font-style">Test style font using font style</p>
    <p class="font-family">Test style font using font family</p>
    <p class="font-size">Test style font using font size</p>
    <p class="roboto-online">Test style font using font Family Online</p>
    <p class="roboto-internal">Test style font using font Family Internal</p>
  </body>
</html>
