<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh styling cascade CSS</title>
    <style>
      .content1 {
        color: red;
      }

      .content2 {
        color: blue;
      }

      #title {
        color: aqua;
      }

      h1 {
        color: green;
      }

      .content1.content2#title {
        color: bisque;
      }

      h1.content1.content2 {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="content1 content2" id="title">Halo Semuaa</h1>
  </body>
</html>
