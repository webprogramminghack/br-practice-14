<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML With internal css</title>
    <style>
      h1.h1 {
        color: red;
        background-color: blue;
      }

      h2#h2 {
        color: aqua;
      }
    </style>
  </head>
  <body>
    <h1>Halo dunia!!</h1>
    <h1 class="h1">Halo dunia!!</h1>
    <h1>Halo dunia!!</h1>
    <h2 id="h2">Halo dunia!!</h2>
  </body>
</html>
